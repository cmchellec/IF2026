/* =========================

function shuffleArray(array){

  const result =
    [...array];

  for(
    let i =
      result.length - 1;

    i > 0;

    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }

  return result;
}

  ){

    $("formError")
      .textContent =
      "Nomor HP tidak valid.";

    return;

  }


  if(
    role === ""
  ){

    $("formError")
      .textContent =
      "Mohon pilih role.";

    return;

  }


  if(
    branch.length < 2
  ){

    $("formError")
      .textContent =
      "Mohon masukkan cabang.";

    return;

  }


  $("formError")
    .textContent =
    "";


  participant = {

    name:name,

    phone:phoneClean,

    role:role,

    branch:branch

  };


  clearQuizTimer();


  current = 0;

  correct = 0;

  answered = false;


  activeQuestions =

    shuffleArray(
      QUESTIONS
    )

    .slice(

      0,

      Math.min(
        QUESTIONS_TO_SHOW,
        QUESTIONS.length
      )

    );


  $("startScreen")
    .classList
    .add("hidden");


  $("resultScreen")
    .classList
    .add("hidden");


  $("quizScreen")
    .classList
    .remove("hidden");


  $("progressBar")
    .style
    .width =
    "0%";


  renderQuestion();

}


/* =========================
   RENDER SOAL
========================= */


function renderQuestion(){


  clearQuizTimer();


  answered = false;


  $("feedback")
    .className =
    "feedback";


  $("feedback")
    .innerHTML =
    "";


  $("nextBtn")
    .style
    .display =
    "none";


  const q =
    activeQuestions[current];


  $("questionNo")
    .textContent =
    `Pertanyaan ${current + 1} dari ${activeQuestions.length}`;


  $("questionText")
    .textContent =
    q.question;


  $("progressBar")
    .style
    .width =
    `${
      (
        current /
        activeQuestions.length
      ) * 100
    }%`;


  $("options")
    .innerHTML =
    "";


  q.options.forEach(

    (
      option,
      index
    ) => {


      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "option";


      button.textContent =
        `${
          String.fromCharCode(
            65 + index
          )
        }. ${option}`;


      button.addEventListener(

        "click",

        () =>
          chooseAnswer(
            index,
            button
          )

      );


      $("options")
        .appendChild(
          button
        );

    }

  );


  startTimer();

}


/* =========================
   TIMER
========================= */


function startTimer(){


  timeLeft =
    TIME_LIMIT;


  updateTimer();


  $("timerBar")
    .style
    .transition =
    "none";


  $("timerBar")
    .style
    .width =
    "100%";


  requestAnimationFrame(

    () => {

      requestAnimationFrame(

        () => {

          $("timerBar")
            .style
            .transition =
            `width ${TIME_LIMIT}s linear`;


          $("timerBar")
            .style
            .width =
            "0%";

        }

      );

    }

  );


  timerId =

    setInterval(

      () => {


        timeLeft--;


        updateTimer();


        if(
          timeLeft <= 0
        ){


          clearQuizTimer();


          timeoutAnswer();

        }

      },

      1000

    );

}


/* =========================
   UPDATE TIMER
========================= */


function updateTimer(){


  $("timer")
    .textContent =
    `${Math.max(
      0,
      timeLeft
    )}s`;


  if(
    timeLeft <= 5
  ){

    $("timer")
      .className =
      "timer danger";

  }

  else{

    $("timer")
      .className =
      "timer";

  }

}


/* =========================
   DISABLE OPTION
========================= */


function disableOptions(){


  document

    .querySelectorAll(
      ".option"
    )

    .forEach(

      button => {

        button.disabled =
          true;

      }

    );

}


/* =========================
   PILIH JAWABAN
========================= */


function chooseAnswer(
  index,
  button
){


  if(answered){
    return;
  }


  answered =
    true;


  clearQuizTimer();


  disableOptions();


  const q =
    activeQuestions[current];


  const buttons =

    [
      ...document
        .querySelectorAll(
          ".option"
        )
    ];


  if(
    index ===
    q.answer
  ){


    correct++;


    button
      .classList
      .add(
        "correct"
      );


    $("feedback")
      .className =
      "feedback good";


    $("feedback")
      .innerHTML =
      `<strong>Benar!</strong><br>${q.explanation}`;

  }


  else{


    button
      .classList
      .add(
        "wrong"
      );


    if(
      buttons[q.answer]
    ){


      buttons[q.answer]
        .classList
        .add(
          "correct"
        );

    }


    $("feedback")
      .className =
      "feedback bad";


    $("feedback")
      .innerHTML =
      `<strong>Belum tepat.</strong><br>${q.explanation}`;

  }


  finishQuestion();

}


/* =========================
   WAKTU HABIS
========================= */


function timeoutAnswer(){


  if(answered){
    return;
  }


  answered =
    true;


  disableOptions();


  const q =
    activeQuestions[current];


  const buttons =

    [
      ...document
        .querySelectorAll(
          ".option"
        )
    ];


  if(
    buttons[q.answer]
  ){

    buttons[q.answer]
      .classList
      .add(
        "correct"
      );

  }


  $("feedback")
    .className =
    "feedback bad";


  $("feedback")
    .innerHTML =
    `<strong>Waktu habis.</strong>
    Jawaban dianggap salah.<br>
    ${q.explanation}`;


  finishQuestion();

}


/* =========================
   FINISH QUESTION
========================= */


function finishQuestion(){


  $("progressBar")
    .style
    .width =

    `${
      (
        (
          current + 1
        ) /
        activeQuestions.length
      ) * 100
    }%`;


  $("nextBtn")
    .textContent =

    current ===
    activeQuestions.length - 1

      ? "Lihat Hasil"

      : "Lanjut";


  $("nextBtn")
    .style
    .display =
    "block";

}


/* =========================
   NEXT QUESTION
========================= */


function nextQuestion(){


  current++;


  if(
    current <
    activeQuestions.length
  ){

    renderQuestion();

  }

  else{

    showResult();

  }

}


/* =========================
   KIRIM KE GOOGLE SHEETS
========================= */


function sendResult(
  score,
  status
){


  if(
    !APPS_SCRIPT_URL ||
    APPS_SCRIPT_URL.includes(
      "PASTE_URL"
    )
  ){

    $("savingStatus")
      .textContent =
      "Mode test: hasil belum terhubung ke Google Sheets.";

    return;

  }


  const data = {

    name:
      participant.name,

    phone:
      participant.phone,

    role:
      participant.role,

    branch:
      participant.branch,

    score:
      score,

    correct:
      correct,

    total:
      activeQuestions.length,

    status:
      status

  };


  $("savingStatus")
    .textContent =
    "Menyimpan hasil...";


  fetch(

    APPS_SCRIPT_URL,

    {

      method:
        "POST",

      headers:{

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(
          data
        )

    }

  )


  .then(

    () => {

      $("savingStatus")
        .textContent =
        "Hasil berhasil dicatat.";

    }

  )


  .catch(

    error => {


      console.error(
        error
      );


      $("savingStatus")
        .textContent =
        "Hasil belum berhasil tersimpan.";

    }

  );

}


/* =========================
   HASIL AKHIR
========================= */


function showResult(){


  clearQuizTimer();


  $("quizScreen")
    .classList
    .add(
      "hidden"
    );


  $("resultScreen")
    .classList
    .remove(
      "hidden"
    );


  $("progressBar")
    .style
    .width =
    "100%";


  const score =

    Math.round(

      (
        correct /
        activeQuestions.length
      ) * 100

    );


  $("scoreText")
    .textContent =
    score;


  const status =

    score >=
    PASSING_SCORE

      ? "Lulus"

      : "Belum Lulus";


  if(
    score >=
    PASSING_SCORE
  ){


    $("resultTitle")
      .textContent =
      "Congratulations!";


    $("resultCopy")
      .textContent =
      `Kamu menjawab ${correct} dari ${activeQuestions.length} pertanyaan dengan benar.`;


    $("resultMessage")
      .innerHTML =

      `
      <div class="reward">

        CONGRATULATIONS!

        <br><br>

        Tunjukkan halaman ini
        ke petugas booth
        untuk mendapatkan souvenir.

      </div>
      `;


    $("restartBtn")
      .textContent =
      "Main Lagi";

  }


  else{


    $("resultTitle")
      .textContent =
      "Almost There!";


    $("resultCopy")
      .textContent =
      `Nilai kamu ${score}.`;


    $("resultMessage")
      .innerHTML =

      `
      <div class="retry">

        Nilai kamu masih belum
        memenuhi skor minimum.

        <br><br>

        Yuk, ulangi quiz dan
        raih kesempatan mendapatkan souvenir.

      </div>
      `;


    $("restartBtn")
      .textContent =
      "Ulang Quiz";

  }


  sendResult(
    score,
    status
  );

}


/* =========================
   BUTTON
========================= */


$("startBtn")
  .addEventListener(
    "click",
    startQuiz
  );


$("nextBtn")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restartBtn")
  .addEventListener(
    "click",
    startQuiz
  );


</script>

</body>
</html>

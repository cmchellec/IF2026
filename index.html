<!DOCTYPE html>
<html lang="id">
<head>

    .wrap{

    .progress{

    }

    .content{

    .hidden{
      display:none;
    }

    .hero,

    }

    .hero{

    }

    h1{
      color:#074ca8;

      margin:10px auto 16px;

    }

    h2{

    }

    .hero-description{

/* =====================================================

===================================================== */

let activeQuestions = [];
let current = 0;
let correct = 0;
let answered = false;
let timeLeft = TIME_LIMIT;
let timerId = null;

const $ = id => document.getElementById(id);


function shuffleArray(array){
  const result = [...array];

  for(let i=result.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));

    [result[i],result[j]] =
    [result[j],result[i]];
  }

  return result;
}


function clearQuizTimer(){
  if(timerId){
    clearInterval(timerId);
    timerId = null;
  }
}


function startQuiz(){

  const name =
    $("nameInput").value.trim();

  const phone =
    $("phoneInput").value.trim();

  const role =
    $("roleInput").value;

  const branch =
    $("branchInput").value.trim();


  if(name.length < 2){
    $("formError").textContent =
      "Mohon masukkan nama lengkap.";
    return;
  }


  const phoneClean =
    phone.replace(/\D/g,"");


  if(
    phoneClean.length < 10 ||
    phoneClean.length > 15
  ){
    $("formError").textContent =
      "Nomor HP tidak valid.";
    return;
  }


  if(role === ""){
    $("formError").textContent =
      "Mohon pilih role.";
    return;
  }


  if(branch.length < 2){
    $("formError").textContent =
      "Mohon masukkan cabang.";
    return;
  }


  $("formError").textContent = "";


  participant = {
    name:name,
    phone:phoneClean,
    role:role,
    branch:branch
  };


  clearQuizTimer();

  current = 0;
  correct = 0;
  answered = false;


  activeQuestions =
    shuffleArray(QUESTIONS)
      .slice(
        0,
        Math.min(
          QUESTIONS_TO_SHOW,
          QUESTIONS.length
        )
      );


  $("startScreen")
    .classList.add("hidden");

  $("resultScreen")
    .classList.add("hidden");

  $("quizScreen")
    .classList.remove("hidden");

  $("progressBar").style.width = "0%";

  renderQuestion();
}


function renderQuestion(){

  clearQuizTimer();
  answered = false;

  $("feedback").className = "feedback";
  $("feedback").innerHTML = "";
  $("nextBtn").style.display = "none";

  const q = activeQuestions[current];

  $("questionNo").textContent =
    `Pertanyaan ${current+1} dari ${activeQuestions.length}`;

  $("questionText").textContent =
    q.question;

  $("progressBar").style.width =
    `${(current/activeQuestions.length)*100}%`;

  $("options").innerHTML = "";


  q.options.forEach(
    (option,index)=>{

      const button =
        document.createElement("button");

      button.type = "button";
      button.className = "option";

      button.textContent =
        `${String.fromCharCode(65+index)}. ${option}`;

      button.addEventListener(
        "click",
        ()=>chooseAnswer(index,button)
      );

      $("options").appendChild(button);
    }
  );


  startTimer();
}


function startTimer(){

  timeLeft = TIME_LIMIT;

  updateTimer();

  $("timerBar").style.transition = "none";
  $("timerBar").style.width = "100%";

  requestAnimationFrame(
    ()=>{
      requestAnimationFrame(
        ()=>{
          $("timerBar").style.transition =
            `width ${TIME_LIMIT}s linear`;

          $("timerBar").style.width = "0%";
        }
      );
    }
  );


  timerId =
    setInterval(
      ()=>{
        timeLeft--;

        updateTimer();

        if(timeLeft <= 0){
          clearQuizTimer();
          timeoutAnswer();
        }
      },
      1000
    );
}


function updateTimer(){

  $("timer").textContent =
    `${Math.max(0,timeLeft)}s`;

  if(timeLeft <= 5){
    $("timer").className =
      "timer danger";
  }else{
    $("timer").className =
      "timer";
  }
}


function disableOptions(){
  document
    .querySelectorAll(".option")
    .forEach(
      button=>{
        button.disabled = true;
      }
    );
}


function chooseAnswer(index,button){

  if(answered){
    return;
  }

  answered = true;

  clearQuizTimer();

  disableOptions();

  const q =
    activeQuestions[current];

  const buttons =
    [...document.querySelectorAll(".option")];


  if(index === q.answer){

    correct++;

    button.classList.add("correct");

    $("feedback").className =
      "feedback good";

    $("feedback").innerHTML =
      `<strong>Benar!</strong><br>${q.explanation}`;

  }else{

    button.classList.add("wrong");

    if(buttons[q.answer]){
      buttons[q.answer]
        .classList
        .add("correct");
    }

    $("feedback").className =
      "feedback bad";

    $("feedback").innerHTML =
      `<strong>Belum tepat.</strong><br>${q.explanation}`;
  }


  finishQuestion();
}


function timeoutAnswer(){

  if(answered){
    return;
  }

  answered = true;

  disableOptions();

  const q =
    activeQuestions[current];

  const buttons =
    [...document.querySelectorAll(".option")];

  if(buttons[q.answer]){
    buttons[q.answer]
      .classList
      .add("correct");
  }

  $("feedback").className =
    "feedback bad";

  $("feedback").innerHTML =
    `<strong>Waktu habis.</strong>
    Jawaban dianggap salah.<br>
    ${q.explanation}`;

  finishQuestion();
}


function finishQuestion(){

  $("progressBar").style.width =
    `${((current+1)/activeQuestions.length)*100}%`;

  $("nextBtn").textContent =
    current === activeQuestions.length-1
      ? "Lihat Hasil"
      : "Lanjut";

  $("nextBtn").style.display =
    "block";
}


function nextQuestion(){

  current++;

  if(current < activeQuestions.length){
    renderQuestion();
  }else{
    showResult();
  }
}


function sendResult(score,status){

  const data = {
    name:participant.name,
    phone:participant.phone,
    role:participant.role,
    branch:participant.branch,
    score:score,
    correct:correct,
    total:activeQuestions.length,
    status:status
  };


  $("savingStatus").textContent =
    "Menyimpan hasil...";


  fetch(
    APPS_SCRIPT_URL,
    {
      method:"POST",
      mode:"no-cors",
      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },
      body:
        JSON.stringify(data)
    }
  )
  .then(
    ()=>{
      $("savingStatus").textContent =
        "Hasil berhasil dikirim.";
    }
  )
  .catch(
    error=>{
      console.error(error);

      $("savingStatus").textContent =
        "Hasil belum berhasil dikirim.";
    }
  );
}


function showResult(){

  clearQuizTimer();

  $("quizScreen")
    .classList
    .add("hidden");

  $("resultScreen")
    .classList
    .remove("hidden");

  $("progressBar").style.width =
    "100%";


  const score =
    Math.round(
      (
        correct /
        activeQuestions.length
      ) * 100
    );


  $("scoreText").textContent =
    score;


  const status =
    score >= PASSING_SCORE
      ? "Lulus"
      : "Belum Lulus";


  if(score >= PASSING_SCORE){

    $("resultTitle").textContent =
      "Mission 1 Completed";

    $("resultCopy").textContent =
      `Kamu menjawab ${correct} dari ${activeQuestions.length} pertanyaan dengan benar.`;

    $("resultMessage").innerHTML =
      `
      <div class="reward">

        <strong>
          Mission 1 Complete
        </strong>

        <br><br>

        Knowledge Quiz berhasil diselesaikan.

        <br><br>

        <strong>
          Next Mission
        </strong>

        <br>

        Lanjutkan ke Memory Challenge Station
        dan tunjukkan halaman ini kepada petugas booth.

        <div class="mission-status">

          <div class="done">
            Mission 1 — Knowledge Quiz — Completed
          </div>

          <div class="pending">
            Mission 2 — Memory Challenge — Pending
          </div>

          <div class="locked">
            Souvenir — Locked
          </div>

        </div>

      </div>
      `;

    /* TOMBOL DIHILANGKAN JIKA LULUS */
    $("restartBtn").style.display =
      "none";

  }else{

    $("resultTitle").textContent =
      "Mission 1 Not Yet Completed";

    $("resultCopy").textContent =
      `Nilai kamu ${score}. Minimum skor untuk melanjutkan ke Mission 2 adalah ${PASSING_SCORE}.`;

    $("resultMessage").innerHTML =
      `
      <div class="retry">

        Mission 2 masih terkunci.

        <br><br>

        Ulangi Knowledge Quiz
        untuk membuka akses ke
        <strong>Memory Challenge</strong>.

        <div class="mission-status">

          <div class="locked">
            Mission 1 — Knowledge Quiz — Not Completed
          </div>

          <div class="locked">
            Mission 2 — Memory Challenge — Locked
          </div>

          <div class="locked">
            Souvenir — Locked
          </div>

        </div>

      </div>
      `;

    /* TOMBOL RETRY TETAP MUNCUL JIKA GAGAL */
    $("restartBtn").style.display =
      "block";

    $("restartBtn").textContent =
      "Retry Mission 1";
  }


  sendResult(
    score,
    status
  );
}


$("startBtn")
  .addEventListener(
    "click",
    startQuiz
  );

$("nextBtn")
  .addEventListener(
    "click",
    nextQuestion
  );

$("restartBtn")
  .addEventListener(
    "click",
    startQuiz
  );

</script>

</body>
</html>

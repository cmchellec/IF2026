<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Investment Financing Challenge</title>

  <style>
    *{
      box-sizing:border-box;
    }

    :root{
      --navy:#073a8c;
      --blue:#0b57d0;
      --blue2:#2b7de9;
      --lilac:#9570e8;
      --pink:#e78ac3;

      --text:#17324d;
      --muted:#667b96;

      --border:#dce7f5;
      --soft-blue:#edf5ff;
      --soft-lilac:#f4efff;
      --soft-pink:#fff1f7;

      --green:#16834b;
      --soft-green:#edfaf2;

      --red:#b23d57;
      --soft-red:#fff1f4;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      color:var(--text);

      background:
        radial-gradient(
          circle at 4% 4%,
          rgba(86,145,255,.14),
          transparent 28%
        ),
        radial-gradient(
          circle at 96% 10%,
          rgba(174,126,235,.12),
          transparent 27%
        ),
        radial-gradient(
          circle at 94% 93%,
          rgba(232,138,196,.12),
          transparent 29%
        ),
        linear-gradient(
          180deg,
          #fbfdff 0%,
          #f8fbff 50%,
          #fbf9ff 100%
        );
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      pointer-events:none;
      z-index:-1;
      border-radius:999px;
      border:1px solid rgba(111,144,210,.16);
    }

    body::before{
      width:460px;
      height:150px;
      right:-180px;
      top:20px;
      transform:rotate(-18deg);
    }

    body::after{
      width:520px;
      height:170px;
      left:-230px;
      bottom:-60px;
      transform:rotate(12deg);
      border-color:rgba(195,124,213,.14);
    }

    button,
    input,
    select{
      font:inherit;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:min(720px,100%);

      background:
        rgba(255,255,255,.96);

      border-radius:30px;
      overflow:hidden;

      border:1px solid rgba(213,226,243,.95);

      box-shadow:
        0 18px 45px rgba(36,78,137,.09);
    }

    .progress{
      height:7px;
      background:#e8eef8;
    }

    .progress div{
      height:100%;
      width:0%;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--blue2),
          var(--lilac),
          var(--pink)
        );

      transition:.25s;
    }

    .content{
      padding:42px 34px 38px;
    }

    .hidden{
      display:none;
    }

    .hero,
    .result{
      text-align:center;
    }


    /* =====================================================
       START SCREEN
    ===================================================== */

    .hero{
      padding:5px 0 6px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding:8px 13px;

      margin-bottom:18px;

      border-radius:999px;

      background:#eef5ff;
      border:1px solid #dbe8fa;

      color:var(--blue);

      font-size:11px;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    h1{
      color:var(--navy);

      font-size:clamp(36px,7vw,52px);
      line-height:1.05;
      letter-spacing:-.04em;

      margin:0 auto 18px;

      max-width:620px;
    }

    .title-gradient{
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--lilac),
          var(--pink)
        );

      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    h2{
      color:var(--navy);
    }

    .hero-description{
      color:var(--muted);

      font-size:16px;
      line-height:1.6;

      max-width:520px;
      margin:0 auto 30px;
    }


    /* =====================================================
       MISSION INTRO
    ===================================================== */

    .mission-intro{
      max-width:540px;

      margin:0 auto 24px;

      padding:10px 22px;

      border-radius:24px;

      background:
        rgba(255,255,255,.92);

      border:1px solid var(--border);

      box-shadow:
        0 10px 26px rgba(47,83,137,.06);

      text-align:left;
    }

    .mission-row{
      display:flex;
      align-items:center;
      gap:15px;

      padding:18px 0;
    }

    .mission-row + .mission-row{
      border-top:1px solid #e8eef7;
    }

    .mission-number{
      width:52px;
      height:52px;

      border-radius:17px;

      display:grid;
      place-items:center;

      flex-shrink:0;

      font-size:17px;
      font-weight:900;
    }

    .mission-number.blue{
      color:var(--blue);

      background:
        linear-gradient(
          145deg,
          #edf5ff,
          #e7f0ff
        );
    }

    .mission-number.lilac{
      color:#8258dd;

      background:
        linear-gradient(
          145deg,
          #f5efff,
          #eee5ff
        );
    }

    .mission-copy{
      flex:1;
    }

    .mission-label{
      font-size:13px;
      font-weight:800;

      margin-bottom:4px;

      color:var(--blue);
    }

    .mission-row:nth-child(2) .mission-label{
      color:#8357db;
    }

    .mission-title{
      font-size:17px;
      font-weight:700;

      color:#26476f;
    }

    .mission-check{
      width:25px;
      height:25px;

      border-radius:50%;

      border:2px solid #7899e6;

      flex-shrink:0;
    }

    .mission-row:nth-child(2) .mission-check{
      border-color:#ad85e8;
    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-area{
      max-width:540px;

      margin:0 auto;

      padding:25px;

      background:
        rgba(255,255,255,.95);

      border:1px solid var(--border);

      border-radius:24px;

      box-shadow:
        0 12px 30px rgba(45,78,126,.06);
    }

    .form-group{
      text-align:left;
      margin-bottom:17px;
    }

    .form-group label{
      display:block;

      margin-bottom:8px;

      font-size:13px;
      font-weight:800;

      color:#27496f;
    }

    .form-group input,
    .form-group select{
      width:100%;

      height:55px;

      padding:0 16px;

      border:1.5px solid #dbe6f3;
      border-radius:15px;

      font-size:15px;

      outline:none;

      background:#fff;
      color:#17324d;

      transition:
        border .15s ease,
        box-shadow .15s ease;
    }

    .form-group input:focus,
    .form-group select:focus{
      border-color:#7a9fe8;

      box-shadow:
        0 0 0 4px rgba(81,130,226,.08);
    }

    #formError{
      min-height:18px;

      color:#a8324d;

      font-size:13px;
      line-height:1.4;

      margin:0 0 11px;

      text-align:left;
    }


    /* =====================================================
       BUTTON
    ===================================================== */

    .primary{
      width:100%;

      border:0;
      border-radius:16px;

      padding:16px 18px;

      font-size:16px;
      font-weight:800;

      color:white;

      cursor:pointer;

      background:
        linear-gradient(
          100deg,
          #0850ca 0%,
          #175edc 55%,
          #7b58db 100%
        );

      box-shadow:
        0 9px 19px rgba(45,79,183,.17);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .primary:hover{
      transform:translateY(-1px);

      box-shadow:
        0 12px 22px rgba(45,79,183,.21);
    }

    .primary:active{
      transform:translateY(1px);
    }


    /* =====================================================
       QUIZ
    ===================================================== */

    .quiz-head{
      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:12px;
      gap:12px;
    }

    #questionNo{
      color:var(--blue);
      font-size:13px;
      font-weight:800;
    }

    .timer{
      font-weight:800;

      background:
        linear-gradient(
          135deg,
          #edf5ff,
          #f5f0ff
        );

      color:var(--blue);

      padding:9px 13px;

      border-radius:999px;

      min-width:62px;

      text-align:center;

      border:1px solid #dae6f7;
    }

    .timer.danger{
      background:#fff1f4;
      color:#d9415d;
      border-color:#ffcbd7;
    }

    .timerbar{
      height:6px;

      background:#edf1f6;

      border-radius:99px;

      overflow:hidden;

      margin-bottom:28px;
    }

    .timerbar div{
      height:100%;
      width:100%;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--blue2),
          var(--lilac)
        );
    }

    .question{
      font-size:23px;
      font-weight:800;
      line-height:1.43;

      margin-bottom:24px;

      color:#153b69;
    }

    .options{
      display:grid;
      gap:12px;
    }

    .option{
      border:1.5px solid #dbe6f4;

      background:#fff;

      border-radius:16px;

      padding:16px 17px;

      text-align:left;

      cursor:pointer;

      font-size:15px;
      line-height:1.45;

      color:#29486a;

      transition:
        border .15s ease,
        background .15s ease,
        transform .15s ease;
    }

    .option:hover{
      border-color:#8ba9eb;

      background:
        linear-gradient(
          90deg,
          #f9fbff,
          #fdfaff
        );

      transform:translateY(-1px);
    }

    .option.correct{
      background:var(--soft-green);
      border-color:#65c88b;
      color:#116b36;
      font-weight:700;
    }

    .option.wrong{
      background:var(--soft-red);
      border-color:#ef93a5;
      color:#a3253d;
    }

    .option:disabled{
      cursor:default;
      transform:none;
    }

    .feedback{
      margin-top:17px;

      padding:15px 16px;

      border-radius:14px;

      display:none;

      line-height:1.5;

      font-size:14px;
    }

    .feedback.good{
      display:block;

      background:var(--soft-green);

      color:#15693a;

      border:1px solid #c4ead2;
    }

    .feedback.bad{
      display:block;

      background:var(--soft-red);

      color:#982c42;

      border:1px solid #ffd0da;
    }

    .next{
      margin-top:18px;
      display:none;
    }


    /* =====================================================
       RESULT
    ===================================================== */

    .result{
      padding-top:5px;
    }

    .result-overline{
      color:#7385a0;

      font-size:13px;
      font-weight:800;

      letter-spacing:.05em;

      margin-bottom:17px;
    }

    .score-ring{
      width:200px;
      height:200px;

      margin:0 auto 15px;

      border-radius:50%;

      padding:7px;

      background:
        conic-gradient(
          from 220deg,
          var(--blue),
          var(--lilac),
          var(--pink),
          #e8edf7 80%
        );
    }

    .score-inner{
      width:100%;
      height:100%;

      border-radius:50%;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      background:#fff;
    }

    .score{
      font-size:70px;
      line-height:.95;

      font-weight:900;

      margin:0;

      letter-spacing:-.05em;

      background:
        linear-gradient(
          120deg,
          var(--blue),
          var(--lilac)
        );

      -webkit-background-clip:text;
      background-clip:text;

      color:transparent;
    }

    .score-label{
      margin-top:10px;

      font-size:14px;

      color:#526d92;
    }

    .result h2{
      font-size:30px;

      margin:22px 0 10px;

      color:var(--blue);

      letter-spacing:-.02em;
    }

    .result p{
      color:#59708a;
      line-height:1.6;
    }


    /* =====================================================
       RESULT CONTENT
    ===================================================== */

    .reward,
    .retry{
      margin:25px 0 20px;

      text-align:left;

      background:#fff;

      border:1px solid var(--border);

      padding:24px;

      border-radius:22px;

      box-shadow:
        0 10px 25px rgba(47,79,124,.05);
    }

    .result-step{
      display:flex;
      gap:15px;
      align-items:flex-start;
    }

    .result-step + .result-step{
      padding-top:22px;
      margin-top:22px;

      border-top:1px dashed #dbe4ef;
    }

    .result-step-icon{
      width:52px;
      height:52px;

      flex-shrink:0;

      border-radius:17px;

      display:grid;
      place-items:center;

      font-size:17px;
      font-weight:900;
    }

    .result-step-icon.complete{
      color:var(--blue);
      background:#edf5ff;
    }

    .result-step-icon.next{
      color:#8457dc;
      background:#f3edff;
    }

    .result-step-title{
      font-weight:800;

      margin-bottom:6px;

      color:var(--blue);
    }

    .result-step.next-step .result-step-title{
      color:#8357db;
    }

    .result-step-copy{
      font-size:14px;
      line-height:1.6;
      color:#5b708e;
    }


    /* =====================================================
       MISSION TRACKER
    ===================================================== */

    .mission-status{
      margin-top:20px;

      padding:22px 12px 12px;

      border-radius:19px;

      background:
        linear-gradient(
          100deg,
          rgba(239,247,255,.78),
          rgba(247,241,255,.76),
          rgba(255,241,248,.78)
        );

      border:1px solid #e2e7f3;
    }

    .progress-title{
      text-align:center;

      font-size:11px;
      font-weight:900;

      letter-spacing:.13em;

      color:#70809d;

      margin-bottom:22px;
    }

    .tracker{
      position:relative;

      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:4px;
    }

    .tracker::before{
      content:"";

      position:absolute;

      top:20px;
      left:16%;
      right:16%;

      height:3px;

      border-radius:99px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--lilac),
          var(--pink)
        );

      opacity:.55;
    }

    .track-step{
      position:relative;
      z-index:1;

      text-align:center;
    }

    .track-dot{
      width:42px;
      height:42px;

      margin:0 auto 10px;

      border-radius:50%;

      display:grid;
      place-items:center;

      font-size:15px;
      font-weight:900;

      background:white;
    }

    .track-step.done .track-dot{
      background:var(--blue);
      color:white;
    }

    .track-step.pending .track-dot{
      border:2px solid var(--lilac);
      color:var(--lilac);
    }

    .track-step.locked .track-dot{
      border:2px solid var(--pink);
      color:#dc6baa;
    }

    .track-label{
      display:block;

      font-size:12px;
      font-weight:800;

      margin-bottom:3px;
    }

    .track-step.done .track-label{
      color:var(--blue);
    }

    .track-step.pending .track-label{
      color:#8058d5;
    }

    .track-step.locked .track-label{
      color:#db68a6;
    }

    .track-copy{
      display:block;

      font-size:10px;
      line-height:1.4;

      color:#6b7c96;
    }

    .track-status{
      display:block;

      margin-top:3px;

      font-size:10px;
      font-weight:800;
    }

    .track-step.done .track-status{
      color:var(--green);
    }

    .track-step.pending .track-status{
      color:#7453c7;
    }

    .track-step.locked .track-status{
      color:#c9578d;
    }


    /* =====================================================
       FINAL MESSAGE
    ===================================================== */

    .final-message{
      margin-top:18px;

      padding:19px 16px;

      border-radius:18px;

      text-align:center;

      font-size:17px;
      font-weight:800;

      color:#143b73;

      background:
        linear-gradient(
          100deg,
          #edf6ff,
          #f5efff,
          #fff0f7
        );

      border:1px solid #e1e5f0;
    }

    .retry{
      color:#6f3f53;
    }

    .retry strong{
      color:#9d4467;
    }

    .saving-status{
      margin-top:13px;

      font-size:12px;

      color:#71859a;

      min-height:16px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:520px){

      .wrap{
        padding:12px;
        align-items:flex-start;
      }

      .card{
        border-radius:24px;
      }

      .content{
        padding:30px 19px;
      }

      h1{
        font-size:37px;
      }

      .hero-description{
        font-size:14px;
      }

      .mission-intro{
        padding:8px 18px;
      }

      .form-area{
        padding:20px;
      }

      .question{
        font-size:20px;
      }

      .option{
        font-size:14px;
      }

      .score-ring{
        width:180px;
        height:180px;
      }

      .score{
        font-size:62px;
      }

      .result h2{
        font-size:27px;
      }

      .track-copy{
        font-size:9px;
      }
    }

  </style>
</head>


<body>

<div class="wrap">

  <div class="card">

    <div class="progress">
      <div id="progressBar"></div>
    </div>


    <div class="content">


      <!-- =====================================================
           HALAMAN AWAL
      ====================================================== -->

      <div id="startScreen" class="hero">

        <div class="eyebrow">
          Investment Financing Challenge
        </div>


        <h1>

          How Well Do You Know

          <span class="title-gradient">
            Investment Financing?
          </span>

        </h1>


        <p class="hero-description">

          Complete

          <strong>
            2 missions
          </strong>

          to unlock your souvenir.

        </p>


        <div class="mission-intro">


          <div class="mission-row">

            <div class="mission-number blue">
              01
            </div>


            <div class="mission-copy">

              <div class="mission-label">
                Mission 1
              </div>

              <div class="mission-title">
                Knowledge Quiz
              </div>

            </div>


            <div class="mission-check"></div>

          </div>


          <div class="mission-row">

            <div class="mission-number lilac">
              02
            </div>


            <div class="mission-copy">

              <div class="mission-label">
                Mission 2
              </div>

              <div class="mission-title">
                Memory Challenge
              </div>

            </div>


            <div class="mission-check"></div>

          </div>


        </div>


        <div class="form-area">


          <div class="form-group">

            <label for="nameInput">
              Nama Lengkap
            </label>

            <input
              type="text"
              id="nameInput"
              placeholder="Masukkan nama lengkap"
              autocomplete="name"
            >

          </div>


          <div class="form-group">

            <label for="phoneInput">
              No. HP
            </label>

            <input
              type="tel"
              id="phoneInput"
              placeholder="08xxxxxxxxxx"
              inputmode="numeric"
              autocomplete="tel"
            >

          </div>


          <div class="form-group">

            <label for="roleInput">
              Role
            </label>

            <select id="roleInput">

              <option value="">
                Pilih role
              </option>

              <option value="Nasabah">
                Nasabah
              </option>

              <option value="PIC Relationship">
                PIC Relationship
              </option>

              <option value="Sales Developer">
                Sales Developer
              </option>

              <option value="Broker">
                Broker
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="branchInput">
              Cabang
            </label>

            <input
              type="text"
              id="branchInput"
              placeholder="Masukkan cabang"
            >

          </div>


          <div id="formError"></div>


          <button
            class="primary"
            id="startBtn"
          >
            Start Mission 1
          </button>


        </div>

      </div>



      <!-- =====================================================
           HALAMAN QUIZ
      ====================================================== -->

      <div
        id="quizScreen"
        class="hidden"
      >


        <div class="quiz-head">

          <strong id="questionNo"></strong>

          <div
            class="timer"
            id="timer"
          >
            20s
          </div>

        </div>


        <div class="timerbar">
          <div id="timerBar"></div>
        </div>


        <div
          class="question"
          id="questionText"
        ></div>


        <div
          class="options"
          id="options"
        ></div>


        <div
          id="feedback"
          class="feedback"
        ></div>


        <button
          class="primary next"
          id="nextBtn"
        >
          Lanjut
        </button>


      </div>



      <!-- =====================================================
           HALAMAN HASIL
      ====================================================== -->

      <div
        id="resultScreen"
        class="result hidden"
      >


        <div class="result-overline">
          MISSION PROGRESS
        </div>


        <div class="score-ring">

          <div class="score-inner">

            <div
              class="score"
              id="scoreText"
            >
              0
            </div>

            <div class="score-label">
              Nilai Akhir
            </div>

          </div>

        </div>


        <h2 id="resultTitle"></h2>


        <p id="resultCopy"></p>


        <div id="resultMessage"></div>


        <button
          class="primary"
          id="restartBtn"
        >
          Retry Mission 1
        </button>


        <div
          class="saving-status"
          id="savingStatus"
        ></div>


      </div>


    </div>

  </div>

</div>



<script>

/* =====================================================
   PENGATURAN
===================================================== */

const TIME_LIMIT = 20;
const PASSING_SCORE = 70;
const QUESTIONS_TO_SHOW = 10;


/* =====================================================
   GOOGLE SHEETS

/* =====================================================

===================================================== */

let activeQuestions = [];
let current = 0;
let correct = 0;
let answered = false;
let timeLeft = TIME_LIMIT;
let timerId = null;

const $ = id => document.getElementById(id);


function shuffleArray(array){

  const result = [...array];

  for(let i=result.length-1;i>0;i--){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }

  return result;
}


function clearQuizTimer(){

  if(timerId){

    clearInterval(timerId);

    timerId = null;

  }

}


function startQuiz(){

  const name =
    $("nameInput").value.trim();

  const phone =
    $("phoneInput").value.trim();

  const role =
    $("roleInput").value;

  const branch =
    $("branchInput").value.trim();


  if(name.length < 2){

    $("formError").textContent =
      "Mohon masukkan nama lengkap.";

    return;

  }


  const phoneClean =
    phone.replace(/\D/g,"");


  if(
    phoneClean.length < 10 ||
    phoneClean.length > 15
  ){

    $("formError").textContent =
      "Nomor HP tidak valid.";

    return;

  }


  if(role === ""){

    $("formError").textContent =
      "Mohon pilih role.";

    return;

  }


  if(branch.length < 2){

    $("formError").textContent =
      "Mohon masukkan cabang.";

    return;

  }


  $("formError").textContent = "";


  participant = {

    name:name,
    phone:phoneClean,
    role:role,
    branch:branch

  };


  clearQuizTimer();


  current = 0;

  correct = 0;

  answered = false;


  activeQuestions =
    shuffleArray(QUESTIONS)
      .slice(
        0,
        Math.min(
          QUESTIONS_TO_SHOW,
          QUESTIONS.length
        )
      );


  $("startScreen")
    .classList.add("hidden");


  $("resultScreen")
    .classList.add("hidden");


  $("quizScreen")
    .classList.remove("hidden");


  $("progressBar").style.width =
    "0%";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  renderQuestion();

}


function renderQuestion(){

  clearQuizTimer();

  answered = false;


  $("feedback").className =
    "feedback";

  $("feedback").innerHTML =
    "";

  $("nextBtn").style.display =
    "none";


  const q =
    activeQuestions[current];


  $("questionNo").textContent =
    `Pertanyaan ${current+1} dari ${activeQuestions.length}`;


  $("questionText").textContent =
    q.question;


  $("progressBar").style.width =
    `${(current/activeQuestions.length)*100}%`;


  $("options").innerHTML =
    "";


  q.options.forEach(
    (option,index)=>{

      const button =
        document.createElement("button");


      button.type =
        "button";


      button.className =
        "option";


      button.textContent =
        `${String.fromCharCode(65+index)}. ${option}`;


      button.addEventListener(
        "click",
        ()=>{
          chooseAnswer(
            index,
            button
          );
        }
      );


      $("options")
        .appendChild(button);

    }
  );


  startTimer();

}


function startTimer(){

  timeLeft =
    TIME_LIMIT;


  updateTimer();


  $("timerBar").style.transition =
    "none";


  $("timerBar").style.width =
    "100%";


  requestAnimationFrame(
    ()=>{

      requestAnimationFrame(
        ()=>{

          $("timerBar").style.transition =
            `width ${TIME_LIMIT}s linear`;

          $("timerBar").style.width =
            "0%";

        }
      );

    }
  );


  timerId =
    setInterval(
      ()=>{

        timeLeft--;


        updateTimer();


        if(timeLeft <= 0){

          clearQuizTimer();

          timeoutAnswer();

        }

      },
      1000
    );

}


function updateTimer(){

  $("timer").textContent =
    `${Math.max(0,timeLeft)}s`;


  if(timeLeft <= 5){

    $("timer").className =
      "timer danger";

  }else{

    $("timer").className =
      "timer";

  }

}


function disableOptions(){

  document
    .querySelectorAll(".option")
    .forEach(
      button=>{

        button.disabled =
          true;

      }
    );

}


function chooseAnswer(
  index,
  button
){

  if(answered){
    return;
  }


  answered =
    true;


  clearQuizTimer();


  disableOptions();


  const q =
    activeQuestions[current];


  const buttons =
    [
      ...document.querySelectorAll(
        ".option"
      )
    ];


  if(index === q.answer){

    correct++;


    button.classList.add(
      "correct"
    );


    $("feedback").className =
      "feedback good";


    $("feedback").innerHTML =
      `<strong>Benar!</strong><br>${q.explanation}`;

  }else{

    button.classList.add(
      "wrong"
    );


    if(buttons[q.answer]){

      buttons[q.answer]
        .classList
        .add("correct");

    }


    $("feedback").className =
      "feedback bad";


    $("feedback").innerHTML =
      `<strong>Belum tepat.</strong><br>${q.explanation}`;

  }


  finishQuestion();

}


function timeoutAnswer(){

  if(answered){
    return;
  }


  answered =
    true;


  disableOptions();


  const q =
    activeQuestions[current];


  const buttons =
    [
      ...document.querySelectorAll(
        ".option"
      )
    ];


  if(buttons[q.answer]){

    buttons[q.answer]
      .classList
      .add("correct");

  }


  $("feedback").className =
    "feedback bad";


  $("feedback").innerHTML =
    `
      <strong>
        Waktu habis.
      </strong>

      Jawaban dianggap salah.

      <br>

      ${q.explanation}
    `;


  finishQuestion();

}


function finishQuestion(){

  $("progressBar").style.width =
    `${((current+1)/activeQuestions.length)*100}%`;


  $("nextBtn").textContent =
    current === activeQuestions.length-1
      ? "Lihat Hasil"
      : "Lanjut";


  $("nextBtn").style.display =
    "block";

}


function nextQuestion(){

  current++;


  if(
    current <
    activeQuestions.length
  ){

    renderQuestion();

  }else{

    showResult();

  }

}

function sendResult(
  score,
  status
){

  const data = {

    name:
      participant.name,

    phone:
      participant.phone,

    role:
      participant.role,

    branch:
      participant.branch,

    score:
      score,

    correct:
      correct,

    total:
      activeQuestions.length,

    status:
      status

  };


  $("savingStatus").textContent =
    "Menyimpan hasil...";


  fetch(
    APPS_SCRIPT_URL,
    {

      method:
        "POST",

      mode:
        "no-cors",

      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(data)

    }
  )
  .then(
    ()=>{

      $("savingStatus").textContent =
        "Hasil berhasil dikirim.";

    }
  )
  .catch(
    error=>{

      console.error(error);


      $("savingStatus").textContent =
        "Hasil belum berhasil dikirim.";

    }
  );

}
